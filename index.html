<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maria d los angeles</title>
    <!-- Iconos de FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #000;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            position: relative;
            background-size: cover;
            background-position: center top;
            background-repeat: no-repeat;
            /* MANTENEMOS LA FOTO DE FONDO */
            background-image: url('img/6F70C234-61FE-4771-A81F-11F5126764EC.JPG'); 
        }

        /* Degradado oscuro en la parte inferior para que el texto resalte */
        .overlay {
            background: linear-gradient(to top, rgba(0, 0, 0, 0.95) 0%, rgba(0, 0, 0, 0.7) 40%, rgba(0, 0, 0, 0) 100%);
            padding: 40px 24px 30px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
        }

        /* --- NUEVO CSS PARA EL AVATAR CIRCULAR --- */
        .profile-avatar-container {
            width: 40px; /* Tamaño del círculo */
            height: 40px; /* Tamaño del círculo */
            border-radius: 50%; /* Lo hace circular */
            overflow: hidden; /* Recorta la imagen al círculo */
            margin-bottom: 10px; /* Espacio antes del nombre */
            border: 2px solid #fff; /* Opcional: un borde blanco fino */
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .profile-avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Asegura que la imagen llene el círculo sin deformarse */
            object-position: center;
        }
        /* ------------------------------------------ */

        .profile-name {
            font-size: 1.8rem; /* Reducido un poco para equilibrar con el avatar de 40px */
            font-weight: 700;
            margin-bottom: 24px;
            text-align: center;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .social-links {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
            align-items: center;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #fff;
            transition: transform 0.2s ease;
        }

        .social-btn:hover {
            transform: scale(1.1);
        }

        /* Botón estilo Instagram con degradado rosa/naranja */
        .instagram-btn {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%,#d6249f 60%,#285AEB 90%);
            font-size: 1.5rem;
        }

        /* Botón TikTok minimalista */
        .tiktok-btn {
            font-size: 1.5rem;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background-color: transparent;
        }

        /* Botón principal Hablemos! (OnlyFans) */
        .cta-btn {
            width: 100%;
            background-color: #d32f2f; /* Rojo/Granate igual al del ejemplo */
            color: #ffffff;
            text-decoration: none;
            text-align: center;
            padding: 16px 0;
            border-radius: 30px;
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(211, 47, 47, 0.4);
            transition: background-color 0.2s, transform 0.2s;
        }

        .cta-btn:hover {
            background-color: #b71c1c;
            transform: translateY(-2px);
        }

        /* Badge "Near You" opcional */
        .location-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: #e91e63;
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="overlay">
            
            <!-- --- NUEVO BLOQUE DEL AVATAR --- -->
            <div class="profile-avatar-container">
                <img src="img/6F70C234-61FE-4771-A81F-11F5126764EC.JPG" alt="Maria d los angeles Avatar" class="profile-avatar-img">
            </div>
            <!-- --------------------------------- -->

            <h1 class="profile-name">Maria d los angeles</h1>

            <!-- Botones de Redes Sociales -->
            <div class="social-links">
                <a href="https://www.instagram.com/mariadlosangelescs?stkn=NmMxYTQ0Mm1vYTJx" target="_blank" class="social-btn instagram-btn" title="Instagram">
                    <i class="fa-brands fa-instagram"></i>
                </a>
                <a href="https://www.tiktok.com/@mariadlosangelescs?_r=1&_t=ZS-9ANAFhztmFw" target="_blank" class="social-btn tiktok-btn" title="TikTok">
                    <i class="fa-brands fa-tiktok"></i>
                </a>
            </div>

            <!-- Botón Principal (OnlyFans) -->
            <a href="https://www.onlyfans.com/mariadlosangeles" target="_blank" class="cta-btn">
                Hablemos!
            </a>

        </div>
    </div>

</body>
</html>
