<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maria d los angeles</title>
    <!-- Iconos de FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #000;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            background-color: #000;
        }

        .profile-avatar-container {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            overflow: hidden;
            margin-bottom: 20px;
            border: 3px solid #fff;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.15);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .profile-avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        .profile-name {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 30px;
            text-align: center;
        }

        .links-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .link-btn {
            width: 100%;
            background-color: #1a1a1a;
            color: #ffffff;
            text-decoration: none;
            text-align: center;
            padding: 16px 20px;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: 700;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background-color 0.2s, transform 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .link-btn:hover {
            background-color: #2a2a2a;
            transform: translateY(-2px);
        }

        /* Botón principal estilizado estilo fucsia/rosado */
        .link-btn.primary {
            background-color: #e91e63;
            border: none;
            box-shadow: 0 4px 15px rgba(233, 30, 99, 0.4);
        }

        .link-btn.primary:hover {
            background-color: #d81b60;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Foto de perfil circular de tamaño medio -->
        <div class="profile-avatar-container">
            <img src="img/6F70C234-61FE-4771-A81F-11F5126764EC.JPG" alt="Maria d los angeles Avatar" class="profile-avatar-img">
        </div>

        <h1 class="profile-name">Maria d los angeles</h1>

        <div class="links-container">
            <!-- Botón único centrado para ir a la landing de redes sociales -->
            <a href="exclusivo.html" class="link-btn primary">
                Mis redes sociales ✨
            </a>
        </div>

    </div>

</body>
</html>
