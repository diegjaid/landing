<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redes Sociales - María de los Ángeles</title>
    <!-- Iconos de FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #000;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            position: relative;
            background-size: cover;
            background-position: center top;
            background-repeat: no-repeat;
            background-image: url('img/6F70C234-61FE-4771-A81F-11F5126764EC.JPG'); 
        }

        .overlay {
            background: linear-gradient(to top, rgba(0, 0, 0, 0.95) 0%, rgba(0, 0, 0, 0.75) 50%, rgba(0, 0, 0, 0.4) 100%);
            padding: 40px 24px 35px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
        }

        .profile-avatar-container {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            overflow: hidden;
            margin-bottom: 10px;
            border: 2px solid #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .profile-avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        .profile-name {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 8px;
            text-align: center;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .profile-description {
            font-size: 0.9rem;
            color: #ddd;
            text-align: center;
            max-width: 340px;
            margin-bottom: 25px;
            line-height: 1.4;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        .social-links {
            display: flex;
            gap: 14px;
            margin-bottom: 25px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #fff;
            transition: transform 0.2s ease;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            font-size: 1.3rem;
        }

        .social-btn:hover {
            transform: scale(1.1);
        }

        .instagram-btn {
            background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%,#d6249f 60%,#285AEB 90%);
        }

        .tiktok-btn {
            background-color: #000;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .facebook-btn {
            background-color: #1877F2;
        }

        .threads-btn {
            background-color: #000;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .youtube-btn {
            background-color: #FF0000;
        }

        .location-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .back-link {
            color: #aaa;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="overlay">
            
            <!-- Mini foto de perfil -->
            <div class="profile-avatar-container">
                <img src="img/6F70C234-61FE-4771-A81F-11F5126764EC.JPG" alt="María de los Ángeles Avatar" class="profile-avatar-img">
            </div>

            <h1 class="profile-name">María de los Ángeles</h1>
            
            <!-- Texto informativo -->
            <p class="profile-description">
                Mi pagina web mas privada 😈 la encontraras en mi Facebook, tiktok, Threads y youtube
            </p>

            <!-- Redes Sociales Oficiales -->
            <div class="social-links">
                <a href="https://www.instagram.com/mariadlosangelescs?stkn=NmMxYTQ0Mm1vYTJx" target="_blank" rel="noopener noreferrer" class="social-btn instagram-btn" aria-label="Instagram">
                    <i class="fa-brands fa-instagram" aria-hidden="true"></i>
                </a>

                <a href="https://www.tiktok.com/@mariadlosangelescs?_r=1&_t=ZS-9ANAFhztmFw" target="_blank" rel="noopener noreferrer" class="social-btn tiktok-btn" aria-label="TikTok">
                    <i class="fa-brands fa-tiktok" aria-hidden="true"></i>
                </a>

                <a href="https://www.facebook.com/share/18bZX7Uf9L/" target="_blank" rel="noopener noreferrer" class="social-btn facebook-btn" aria-label="Facebook">
                    <i class="fa-brands fa-facebook-f" aria-hidden="true"></i>
                </a>

                <a href="https://www.threads.net/@mariadlosangelescs" target="_blank" rel="noopener noreferrer" class="social-btn threads-btn" aria-label="Threads">
                    <i class="fa-brands fa-threads" aria-hidden="true"></i>
                </a>

                <a href="https://www.youtube.com/@mariadlosangelescs" target="_blank" rel="noopener noreferrer" class="social-btn youtube-btn" aria-label="YouTube">
                    <i class="fa-brands fa-youtube" aria-hidden="true"></i>
                </a>
            </div>

            <div class="location-badge">
                <i class="fa-solid fa-location-dot" aria-hidden="true"></i> Near You
            </div>

            <!-- Enlace para volver al inicio -->
            <a href="index.html" class="back-link">
                ← Volver al inicio
            </a>

        </div>
    </div>

</body>
</html>
